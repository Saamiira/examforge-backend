<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a ExamForge</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#1e3a8a;">¡Bienvenido a ExamForge!</h1>
            <p style="margin:0 0 12px;">Hola <strong th:text="${fullName}">Estudiante</strong>,</p>
            <p style="margin:0 0 12px;">Tu cuenta se creó correctamente. Ya puedes subir el material de tus cursos
                y generar evaluaciones de práctica basadas en él.</p>
            <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">Este es un correo automático, por favor no respondas.</p>
        </td>
    </tr>
</table>
</body>
</html>
