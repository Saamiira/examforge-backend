<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tu evaluación está lista</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#1e3a8a;">Tu evaluación está lista</h1>
            <p style="margin:0 0 12px;">Hola <strong th:text="${fullName}">Estudiante</strong>,</p>
            <p style="margin:0 0 12px;">La evaluación <strong th:text="'#' + ${assessmentId}">#1</strong>
                terminó de generarse a partir de tu material.</p>
            <p style="margin:0 0 12px;">Ya puedes revisarla, editar sus preguntas o resolverla en ExamForge.</p>
            <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">Este es un correo automático, por favor no respondas.</p>
        </td>
    </tr>
</table>
</body>
</html>
